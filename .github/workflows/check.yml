name: check

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version:
          - stable
          - oldstable
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
      - name: Check gofmt
        run: test -z "$(gofmt -l .)"
      - name: Lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: latest
      - name: Test
        run: go test -race -count=1 ./...

  fuzz:
    # A panic in txnproof takes its host application down with it, so the
    # parsers, the classifier and the detector itself are fuzzed on every
    # change — not only replayed against the committed corpora (which the
    # test job above already does).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Fuzz
        run: make fuzz FUZZTIME=15s
      - name: Show discovered crashers
        # Failing inputs are written into testdata/fuzz/ and are lost with the
        # runner; print them so they can be committed as regression seeds.
        if: failure()
        run: find . -path '*/testdata/fuzz/*' -type f -print -exec cat {} \;

  examples:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module:
          - examples/graphql
          - examples/nethttp
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Build
        working-directory: ${{ matrix.module }}
        run: go build ./...
      - name: Lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: latest
          working-directory: ${{ matrix.module }}
      - name: Smoke run
        # Both examples are self-terminating demos that must report at least
        # one violation; build-only would miss runtime regressions.
        working-directory: ${{ matrix.module }}
        run: go run . 2>&1 | tee /tmp/smoke.out && grep -q "non-atomic SQL execution detected" /tmp/smoke.out

  e2e:
    # Runs the e2e module against a real PostgreSQL. A services: container
    # would not expose its log file to the runner, so run.sh initdbs a
    # throwaway cluster instead. The pgcheck parser handles version-specific
    # log renderings (e.g. %v as N/0 vs 0/0), so cover the supported majors.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pg-version:
          - 16
          - 17
          - 18
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: e2e/go.sum
      - name: Install PostgreSQL ${{ matrix.pg-version }}
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-${{ matrix.pg-version }}
      - name: Check gofmt
        working-directory: e2e
        run: test -z "$(gofmt -l .)"
      - name: Lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: latest
          working-directory: e2e
      - name: Run e2e tests against a throwaway PostgreSQL cluster
        # run.sh prefers binaries on PATH, so prepend the matrix version's.
        run: PATH="/usr/lib/postgresql/${{ matrix.pg-version }}/bin:$PATH" ./e2e/run.sh -v

  e2e-mysql:
    # Runs the e2e-mysql module against a real MySQL, across the supported
    # release lines (8.0, 8.4 LTS, 9 innovation). A services: container
    # cannot pass mysqld arguments, so the official image is started with
    # docker run, with the general query log on a bind mount so the runner
    # can read it. (run.sh stays the local, binaries-on-PATH way to run
    # these tests; this job wires the env vars directly.)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mysql-version:
          - '8.0'
          - '8.4'
          - '9'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: e2e-mysql/go.sum
      - name: Start MySQL ${{ matrix.mysql-version }} with a general query log
        run: |
          logdir="${RUNNER_TEMP}/mysql-general"
          mkdir -p "$logdir" && chmod 777 "$logdir"
          docker run -d --name mysql-e2e \
            -e MYSQL_ALLOW_EMPTY_PASSWORD=1 \
            -e MYSQL_DATABASE=txproof_e2e \
            -p 127.0.0.1:3306:3306 \
            -v "$logdir":/var/log/mysql-general \
            mysql:${{ matrix.mysql-version }} \
            --general-log=1 \
            --general-log-file=/var/log/mysql-general/general.log \
            --log-output=FILE \
            --log-timestamps=UTC
          # Ping over TCP inside the container: the image's init phase runs a
          # socket-only temp server, so a socket ping would succeed too early.
          for _ in $(seq 1 60); do
            if docker exec mysql-e2e mysqladmin ping -h127.0.0.1 --silent 2>/dev/null; then
              # mysqld creates the log 0640 root-unreadable from the runner.
              docker exec mysql-e2e chmod 644 /var/log/mysql-general/general.log
              exit 0
            fi
            sleep 2
          done
          docker logs mysql-e2e
          exit 1
      - name: Check gofmt
        working-directory: e2e-mysql
        run: test -z "$(gofmt -l .)"
      - name: Lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: latest
          working-directory: e2e-mysql
      - name: Run e2e tests
        working-directory: e2e-mysql
        env:
          TXPROOF_E2E_MYSQL_DSN: root@tcp(127.0.0.1:3306)/txproof_e2e
          TXPROOF_E2E_MYSQL_LOG: ${{ runner.temp }}/mysql-general/general.log
        run: go test -v -count=1 ./...
